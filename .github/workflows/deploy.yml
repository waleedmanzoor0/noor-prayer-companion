name: Build and deploy Noor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Noor
        env:
          VITE_SUPABASE_URL: https://uuzgfzivxehlugzqgtaj.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_MAzXgWivMedrb6eKrYT8Qg_DJKzKDTQ
          VITE_VAPID_PUBLIC_KEY: BHaw5yuKfITVD5Y5euuXH_Me0_B34dlzh0tm1Hld_JiedCEbHot_TuGeE74TwDlXMuETpUzX88Ci4mtZeVhiLsU
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
